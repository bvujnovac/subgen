# Subgen Bazarr Edition - Docker Compose
# Whisper ASR server for Bazarr subtitle generation

version: '3.8'
services:
  subgen:
    container_name: subgen
    # Build locally:
    # build: .
    # Use pre-built image from GHCR:
    image: ghcr.io/bvujnovac/subgen:latest
    environment:
      - WHISPER_MODEL=medium
      - WHISPER_THREADS=4
      - TRANSCRIBE_DEVICE=cuda
      - COMPUTE_TYPE=auto
      - WEBHOOK_PORT=9000
      - DEBUG=false
      - CLEAR_VRAM_ON_COMPLETE=true
      - WORD_LEVEL_HIGHLIGHT=false
      - APPEND=false
      - MODEL_PATH=/models
      # Optional: Custom temp file location for large uploads
      # - TEMP_FILE_PATH=/tmp/subgen
      # Optional: Force detected language
      # - FORCE_DETECTED_LANGUAGE_TO=en
      # Optional: Language detection settings
      # - DETECT_LANGUAGE_LENGTH=30
      # - DETECT_LANGUAGE_OFFSET=0
      # Optional: Custom segment grouping
      # - CUSTOM_REGROUP=cm_sl=84_sl=42++++++1
    volumes:
      - ./models:/models
    ports:
      - "9000:9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
